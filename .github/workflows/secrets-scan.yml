name: Secrets Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit in the push/PR,
          # not just the checked-out tree.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
